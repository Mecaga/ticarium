<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>BlokDiyar - Admin ve Kanal Paneli</title>
    <style>
        body { background: #121212; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        .section { background: #1e1e1e; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        button { background: #ff4444; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-right: 5px; margin-top: 5px; }
        button.green { background: #4CAF50; }
        button.blue { background: #2196F3; button.orange { background: #ff9800; }
        button.purple { background: #9c27b0; }
        ul { list-style: none; padding: 0; }
        li { background: #2a2a2a; margin: 8px 0; padding: 12px; border-radius: 6px; }
        .user-row { display: flex; justify-content: space-between; align-items: center; }
        #auth-status { font-size: 16px; margin-bottom: 15px; font-weight: bold; color: #ffa500; }
        .user-worlds-box { background: #181818; padding: 12px; margin-top: 10px; border-radius: 5px; border-left: 4px solid #ff9800; display: none; }
        .world-card { background: #222; padding: 10px; margin-top: 8px; border-radius: 5px; border: 1px solid #444; }
        input[type="text"] { background: #333; color: #fff; border: 1px solid #555; padding: 5px; border-radius: 4px; width: 70%; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h1>🛡️ BlokDiyar Admin & Kanal Yönetim Paneli</h1>
    <div id="auth-status">Giriş kontrol ediliyor...</div>

    <div id="admin-content" style="display:none;">
        
        <!-- ADMINİN KENDİ AÇIK ODALARI VE KANALLARI -->
        <div class="section" style="border: 2px solid #4CAF50;">
            <h2>🌟 Admin (mecaga5354) Açık Odalarım ve Kanallarım</h2>
            <ul id="admin-public-rooms"></ul>
        </div>

        <!-- TÜM KULLANICILAR VE DÜNYALARI -->
        <div class="section">
            <h2>👥 Tüm Kullanıcılar ve Dünyaları</h2>
            <ul id="user-list"></ul>
        </div>
    </div>

    <!-- Firebase SDK'ları -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBqq-KjCuhwsXLLWbfICps4YFzotAOTv8",
            authDomain: "ticarium-c352c.firebaseapp.com",
            databaseURL: "https://ticarium-c352c-default-rtdb.firebaseio.com",
            projectId: "ticarium-c352c",
            storageBucket: "ticarium-c352c.firebasestorage.app",
            messagingSenderId: "527594429663",
            appId: "1:527594429663:web:dd1ffb82249264bebbdd6a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const ADMIN_EMAIL = "mecaga5354@blokdiyar.app"; 

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('auth-status').innerText = `Hoş geldin Admin: ${user.email}`;
                document.getElementById('auth-status').style.color = '#4CAF50';
                document.getElementById('admin-content').style.display = 'block';
                loadAdminData();
            } else {
                const currentEmail = user ? user.email : "Giriş yapılmamış";
                document.getElementById('auth-status').innerText = `Yetkisiz erişim! (${currentEmail}) Lütfen mecaga5354 hesabıyla giriş yap.`;
                document.getElementById('auth-status').style.color = '#ff4444';
            }
        });

        function loadAdminData() {
            // 1. Adminin ve genel sistemin açık odalarını / kanallarını yükle
            loadAdminPublicRooms();

            // 2. Tüm kullanıcıları yükle
            const userRef = ref(db, 'users');
            get(userRef).then((snapshot) => {
                const userListUl = document.getElementById('user-list');
                userListUl.innerHTML = '';
                if (!snapshot.exists()) {
                    userListUl.innerHTML = '<li>Kayıtlı kullanıcı bulunamadı.</li>';
                    return;
                }
                snapshot.forEach((childSnapshot) => {
                    const uid = childSnapshot.key;
                    const userData = childSnapshot.val() || {};
                    const profile = userData.profile || {};
                    const userEmail = profile.email || "E-posta bulunamadı";
                    
                    let li = document.createElement('li');
                    li.innerHTML = `
                        <div class="user-row">
                            <span><b>Kullanıcı:</b> ${profile.username || profile.name || 'İsimsiz'} <br><small style="color:#aaa;">E-posta: ${userEmail}</small><br><small style="color:#888;">UID: ${uid}</small></span>
                            <div>
                                <button class="purple" onclick="window.sendResetEmail('${userEmail}')">Şifre Sıfırla</button>
                                <button class="orange" onclick="window.toggleUserWorlds('${uid}')">Dünyalarını Gör</button>
                                <button onclick="window.deleteUser('${uid}')">Hesabı Sil</button>
                            </div>
                        </div>
                        <div id="user-worlds-${uid}" class="user-worlds-box">
                            <p>Dünyalar yükleniyor...</p>
                        </div>
                    `;
                    userListUl.appendChild(li);
                });
            });
        }

        // Adminin açık odalarını / kanallarını listeleyen fonksiyon
        function loadAdminPublicRooms() {
            const publicRef = ref(db, 'publicRooms');
            get(publicRef).then((snapshot) => {
                const container = document.getElementById('admin-public-rooms');
                container.innerHTML = '';
                if (!snapshot.exists()) {
                    container.innerHTML = '<li>Henüz herkese açık oda/kanal bulunmuyor.</li>';
                    return;
                }
                snapshot.forEach((childSnapshot) => {
                    const roomId = childSnapshot.key;
                    const roomData = childSnapshot.val();

                    let li = document.createElement('li');
                    li.innerHTML = `
                        <span><b>Kanal / Oda ID:</b> <span style="color:#4CAF50;">${roomId}</span></span>
                        <div>
                            <button class="orange" onclick="window.makeWorldPrivate('${roomId}')">Özel Yap (Kapat)</button>
                            <button onclick="window.deleteGlobalRoom('${roomId}')">Tamamen Sil</button>
                        </div>
                    `;
                    container.appendChild(li);
                });
            });
        }

        // Şifre Sıfırlama E-postası Gönderme
        window.sendResetEmail = function(email) {
            if (!email || email.includes("Bulunamadı")) {
                alert("Bu kullanıcının geçerli bir e-posta adresi kayıtlı değil. Hesabı silip yeniden oluşturabilirsiniz.");
                return;
            }
            sendPasswordResetEmail(auth, email).then(() => {
                alert(`${email} adresine şifre sıfırlama talimatı gönderildi!`);
            }).catch((error) => {
                alert("Hata oluştu: " + error.message);
            });
        }

        // Kullanıcının dünyalarını açıp kapatan fonksiyon
        window.toggleUserWorlds = function(uid) {
            const box = document.getElementById(`user-worlds-${uid}`);
            if (box.style.display === 'block') {
                box.style.display = 'none';
                return;
            }
            box.style.display = 'block';

            const userRef = ref(db, `users/${uid}`);
            get(userRef).then((snapshot) => {
                if (!snapshot.exists()) {
                    box.innerHTML = '<p>Bu kullanıcıya ait veri yok.</p>';
                    return;
                }
                const data = snapshot.val();
                let html = '<h4>Bu Kullanıcının Dünyaları / Odaları:</h4>';
                
                let foundWorlds = false;
                for (let key in data) {
                    if (key === 'profile') continue;

                    foundWorlds = true;
                    let worldData = data[key];

                    html += `
                        <div class="world-card">
                            <b>Oda / Dünya ID:</b> <span style="color:#2196F3;">${key}</span><br><br>
                            <label>Özellikler / Ayarlar:</label><br>
                            <input type="text" id="input-${uid}-${key}" value='${JSON.stringify(worldData)}'><br>
                            
                            <button class="green" onclick="window.saveWorldSettings('${uid}', '${key}')">Ayarları Kaydet</button>
                            <button class="blue" onclick="window.makeWorldPublic('${key}', ${JSON.stringify(worldData).replace(/'/g, "&#39;")})">Herkese Aç</button>
                            <button class="orange" onclick="window.makeWorldPrivate('${key}')">Özel Yap</button>
                            <button onclick="window.deleteUserWorld('${uid}', '${key}')">Dünyayı Sil</button>
                        </div>
                    `;
                }

                if (!foundWorlds) {
                    html += '<p style="color:#aaa;">Bu kullanıcının oluşturduğu herhangi bir dünya bulunamadı.</p>';
                }

                box.innerHTML = html;
            });
        }

        // Dünya ayarlarını güncelleme
        window.saveWorldSettings = function(uid, worldKey) {
            const valStr = document.getElementById(`input-${uid}-${worldKey}`).value;
            let parsedVal;
            try {
                parsedVal = JSON.parse(valStr);
            } catch (e) {
                parsedVal = valStr;
            }

            const updates = {};
            updates[`users/${uid}/${worldKey}`] = parsedVal;
            updates[`rooms/${worldKey}`] = parsedVal;

            update(ref(db), updates).then(() => {
                alert("Dünya ayarları başarıyla güncellendi!");
            }).catch((err) => {
                alert("Hata: " + err.message);
            });
        }

        // Dünyayı Herkese Açık Yapma (Doğrudan oyunun listelemesi için rooms ve publicRooms altına işler)
        window.makeWorldPublic = function(worldKey, worldData) {
            const publicPayload = (typeof worldData === 'object' && worldData !== null) ? worldData : { active: true, name: worldKey };
            const updates = {};
            updates[`publicRooms/${worldKey}`] = publicPayload;
            updates[`rooms/${worldKey}`] = publicPayload;

            update(ref(db), updates).then(() => {
                alert("Oda herkese açık hale getirildi ve oyun listesine eklendi!");
                loadAdminPublicRooms(); // Paneli yenile
            }).catch((err) => {
                alert("Hata: " + err.message);
            });
        }

        // Dünyayı Özel Yapma (Kapatma)
        window.makeWorldPrivate = function(worldKey) {
            remove(ref(db, `publicRooms/${worldKey}`)).then(() => {
                alert("Oda özel konuma getirildi ve aktif listeden kaldırıldı!");
                loadAdminPublicRooms(); // Paneli yenile
            });
        }

        // Genel odalardan tamamen silme
        window.deleteGlobalRoom = function(roomId) {
            if (confirm(`Bu odayı (${roomId}) tamamen silmek istiyor musun?`)) {
                remove(ref(db, `publicRooms/${roomId}`));
                remove(ref(db, `rooms/${roomId}`)).then(() => {
                    alert("Oda tamamen silindi!");
                    loadAdminPublicRooms();
                });
            }
        }

        // Kullanıcının dünyasını silme
        window.deleteUserWorld = function(uid, worldKey) {
            if (confirm(`Bu dünyayı (${worldKey}) silmek istediğine emin misin?`)) {
                remove(ref(db, `users/${uid}/${worldKey}`));
                remove(ref(db, `rooms/${worldKey}`));
                remove(ref(db, `publicRooms/${worldKey}`)).then(() => {
                    alert("Dünya silindi!");
                    toggleUserWorlds(uid);
                    loadAdminPublicRooms();
                });
            }
        }

        // Kullanıcıyı silme
        window.deleteUser = function(uid) {
            if (confirm("Bu kullanıcıyı ve tüm verilerini silmek istiyor musun?")) {
                remove(ref(db, 'users/' + uid)).then(() => {
                    alert("Kullanıcı silindi!");
                    loadAdminData();
                });
            }
        }
    </script>
</body>
</html>
