<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>BlokDiyar - Tuval ve Dünya Yönetim Paneli</title>
    <style>
        body { background: #121212; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        .section { background: #1e1e1e; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        button { background: #ff4444; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-right: 4px; margin-top: 5px; }
        button.green { background: #4CAF50; }
        button.blue { background: #2196F3; }
        button.orange { background: #ff9800; }
        button.purple { background: #9c27b0; }
        ul { list-style: none; padding: 0; }
        li { background: #2a2a2a; margin: 8px 0; padding: 12px; border-radius: 6px; }
        .user-row { display: flex; justify-content: space-between; align-items: center; }
        #auth-status { font-size: 16px; margin-bottom: 15px; font-weight: bold; color: #ffa500; }
        .user-worlds-box { background: #181818; padding: 12px; margin-top: 10px; border-radius: 5px; border-left: 4px solid #2196F3; display: none; }
        .world-item { background: #222; padding: 10px; margin-top: 8px; border-radius: 4px; border: 1px solid #444; }
        .world-settings-box { background: #161616; padding: 10px; margin-top: 8px; border-radius: 4px; border-left: 3px solid #ff9800; display: none; }
        textarea { background: #333; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 4px; width: 100%; height: 80px; margin-bottom: 5px; font-family: monospace; resize: vertical; }
        .canvas-preview-container { margin-top: 10px; background: #111; padding: 10px; border-radius: 4px; text-align: center; border: 1px dashed #555; display: none; }
        .canvas-preview-container img { max-width: 100%; max-height: 300px; border: 2px solid #444; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>🛡️ BlokDiyar Tuval ve Yönetim Paneli</h1>
    <div id="auth-status">Giriş kontrol ediliyor...</div>

    <div id="admin-content" style="display:none;">
        
        <!-- HIZLI ODA YÖNETİMİ -->
        <div class="section" style="border: 2px solid #4CAF50; text-align: center;">
            <h2>🚀 Hızlı Oda Yönetimi</h2>
            <button class="green" style="padding: 10px 16px; font-size: 15px;" onclick="window.makeAllWorldsPublic()">🌟 TÜM DÜNYALARI TEK TUŞLA HERKESE AÇ</button>
        </div>

        <!-- AKTİF HERKESE AÇIK KANALLAR -->
        <div class="section">
            <h2>🌟 Aktif Herkese Açık Odalar</h2>
            <ul id="admin-public-rooms"></ul>
        </div>

        <!-- KULLANICILAR VE DÜNYALARI -->
        <div class="section">
            <h2>👥 Kullanıcılar ve Dünyaları</h2>
            <ul id="user-list"></ul>
        </div>
    </div>

    <!-- Firebase SDK'ları -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBqq-KjCuhwsXLLWbfICps4YFzotAOTv8",
            authDomain: "ticarium-c352c.firebaseapp.com",
            databaseURL: "https://ticarium-c352c-default-rtdb.firebaseio.com",
            projectId: "ticarium-c352c",
            storageBucket: "ticarium-c352c.firebasestorage.app",
            messagingSenderId: "527594429663",
            appId: "1:527594429663:web:dd1ffb82249264bebbdd6a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const ADMIN_EMAIL = "mecaga5354@blokdiyar.app"; 

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('auth-status').innerText = `Hoş geldin Admin: ${user.email}`;
                document.getElementById('auth-status').style.color = '#4CAF50';
                document.getElementById('admin-content').style.display = 'block';
                loadAdminData();
            } else {
                const currentEmail = user ? user.email : "Giriş yapılmamış";
                document.getElementById('auth-status').innerText = `Yetkisiz erişim! (${currentEmail}) Lütfen mecaga5354 hesabıyla giriş yap.`;
                document.getElementById('auth-status').style.color = '#ff4444';
            }
        });

        function loadAdminData() {
            loadAdminPublicRooms();

            const userRef = ref(db, 'users');
            get(userRef).then((snapshot) => {
                const userListUl = document.getElementById('user-list');
                userListUl.innerHTML = '';
                if (!snapshot.exists()) {
                    userListUl.innerHTML = '<li>Kayıtlı kullanıcı bulunamadı.</li>';
                    return;
                }
                snapshot.forEach((childSnapshot) => {
                    const uid = childSnapshot.key;
                    const userData = childSnapshot.val() || {};
                    const profile = userData.profile || {};
                    const userEmail = profile.email || "E-posta bulunamadı";
                    
                    let li = document.createElement('li');
                    li.innerHTML = `
                        <div class="user-row">
                            <span><b>Kullanıcı:</b> ${profile.username || profile.name || 'İsimsiz'} <br><small style="color:#aaa;">E-posta: ${userEmail}</small><br><small style="color:#888;">UID: ${uid}</small></span>
                            <div>
                                <button class="purple" onclick="window.sendResetEmail('${userEmail}')">Şifre Sıfırla</button>
                                <button class="blue" onclick="window.toggleUserWorlds('${uid}')">Dünyalarını Gör</button>
                                <button onclick="window.deleteUser('${uid}')">Hesabı Sil</button>
                            </div>
                        </div>
                        <div id="user-worlds-${uid}" class="user-worlds-box">
                            <p>Dünyalar yükleniyor...</p>
                        </div>
                    `;
                    userListUl.appendChild(li);
                });
            });
        }

        window.loadAdminPublicRooms = function() {
            const publicRef = ref(db, 'rooms');
            get(publicRef).then((snapshot) => {
                const container = document.getElementById('admin-public-rooms');
                container.innerHTML = '';
                if (!snapshot.exists()) {
                    container.innerHTML = '<li>Aktif herkese açık oda bulunmuyor.</li>';
                    return;
                }
                snapshot.forEach((childSnapshot) => {
                    const roomId = childSnapshot.key;
                    let li = document.createElement('li');
                    li.innerHTML = `
                        <span><b>Oda ID:</b> <span style="color:#4CAF50;">${roomId}</span></span>
                        <div>
                            <button class="orange" onclick="window.makeWorldPrivate('${roomId}')">Özel Yap (Kapat)</button>
                            <button onclick="window.deleteGlobalRoom('${roomId}')">Dünyayı Sil</button>
                        </div>
                    `;
                    container.appendChild(li);
                });
            });
        }

        window.toggleUserWorlds = function(uid) {
            const box = document.getElementById(`user-worlds-${uid}`);
            if (box.style.display === 'block') {
                box.style.display = 'none';
                return;
            }
            box.style.display = 'block';

            const userRef = ref(db, `users/${uid}`);
            get(userRef).then((snapshot) => {
                if (!snapshot.exists()) {
                    box.innerHTML = '<p>Bu kullanıcıya ait veri yok.</p>';
                    return;
                }
                const data = snapshot.val();
                let html = '<h4>📁 Kullanıcının Dünyaları ve Tuval Resimleri:</h4>';
                
                let foundWorlds = false;
                for (let key in data) {
                    if (key === 'profile') continue;

                    foundWorlds = true;
                    let worldData = data[key];
                    let worldJson = JSON.stringify(worldData, null, 2);

                    html += `
                        <div class="world-item">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span><b>Dünya ID:</b> <span style="color:#2196F3;">${key}</span></span>
                                <div>
                                    <button class="purple" onclick="window.viewCanvas('${uid}', '${key}')">🖼️ Tuval Resmini Gör</button>
                                    <button class="blue" onclick="window.toggleWorldSettings('${uid}', '${key}')">Düzenle</button>
                                </div>
                            </div>

                            <!-- Tuval Resmi Önizleme Alanı -->
                            <div id="canvas-preview-${uid}-${key}" class="canvas-preview-container">
                                <p style="color:#aaa; font-size:12px;">Tuval aranıyor...</p>
                            </div>
                            
                            <!-- Ayar ve Düzenleme Kutusu -->
                            <div id="world-settings-${uid}-${key}" class="world-settings-box">
                                <label style="font-size:12px; color:#aaa;">Oda Ayarları / Özellikleri (JSON):</label>
                                <textarea id="input-${uid}-${key}">${worldJson}</textarea>
                                
                                <div>
                                    <button class="green" onclick="window.saveWorldSettings('${uid}', '${key}')">Ayarları Kaydet</button>
                                    <button class="blue" onclick="window.makeWorldPublicDirect('${key}', ${JSON.stringify(worldData).replace(/'/g, "&#39;")})">Herkese Aç</button>
                                    <button class="orange" onclick="window.makeWorldPrivate('${key}')">Özel Yap</button>
                                    <button onclick="window.deleteUserWorld('${uid}', '${key}')">Dünyayı Sil</button>
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (!foundWorlds) {
                    html += '<p style="color:#aaa;">Bu kullanıcının oluşturulmuş dünyası yok.</p>';
                }

                box.innerHTML = html;
            });
        }

        // Tuval bloğuna ait resmi bulup ekranda gösteren fonksiyon
        window.viewCanvas = function(uid, worldKey) {
            const previewBox = document.getElementById(`canvas-preview-${uid}-${worldKey}`);
            if (previewBox.style.display === 'block') {
                previewBox.style.display = 'none';
                return;
            }
            previewBox.style.display = 'block';
            previewBox.innerHTML = '<p style="color:#ffa500; font-size:12px;">Tuval verisi taranıyor...</p>';

            const worldRef = ref(db, `users/${uid}/${worldKey}`);
            get(worldRef).then((snapshot) => {
                if (!snapshot.exists()) {
                    previewBox.innerHTML = '<p style="color:#ff4444; font-size:12px;">Dünya verisi bulunamadı.</p>';
                    return;
                }
                const worldData = snapshot.val();
                let canvasImageSrc = null;

                // Verinin içinde tuval (canvas, image, picture, drawing vb.) verisi arıyoruz
                // Genellikle base64 string veya URL olarak saklanır
                function findCanvasRecursive(obj) {
                    if (!obj || typeof obj !== 'object') return null;
                    for (let k in obj) {
                        let val = obj[k];
                        if (typeof val === 'string' && (val.startsWith('data:image') || val.startsWith('http') || val.length > 500)) {
                            // Büyük metin veya base64 resim verisi olabilir
                            return val;
                        }
                        if (typeof val === 'object') {
                            let found = findCanvasRecursive(val);
                            if (found) return found;
                        }
                    }
                    return null;
                }

                canvasImageSrc = findCanvasRecursive(worldData);

                if (canvasImageSrc) {
                    if (!canvasImageSrc.startsWith('data:image') && !canvasImageSrc.startsWith('http')) {
                        canvasImageSrc = 'data:image/png;base64,' + canvasImageSrc;
                    }
                    previewBox.innerHTML = `
                        <p style="color:#4CAF50; font-size:12px; margin-bottom:5px;"><b>Tuval Resmi Bulundu:</b></p>
                        <img src="${canvasImageSrc}" alt="Tuval Resmi" onerror="this.onerror=null; this.parentElement.innerHTML='<p style=\'color:red; font-size:12px;\'>Resim formatı çözülemedi (Metin verisi olabilir).</p>';">
                    `;
                } else {
                    previewBox.innerHTML = '<p style="color:#aaa; font-size:12px;">Bu dünyada kayıtlı bir tuval resmi/çizimi bulunamadı.</p>';
                }
            });
        }

        window.toggleWorldSettings = function(uid, worldKey) {
            const settingsBox = document.getElementById(`world-settings-${uid}-${worldKey}`);
            settingsBox.style.display = (settingsBox.style.display === 'block') ? 'none' : 'block';
        }

        window.saveWorldSettings = function(uid, worldKey) {
            const valStr = document.getElementById(`input-${uid}-${worldKey}`).value;
            let parsedVal;
            try {
                parsedVal = JSON.parse(valStr);
            } catch (e) {
                alert("Hata: Geçerli bir JSON formatı girmelisin!");
                return;
            }

            const updates = {};
            updates[`users/${uid}/${worldKey}`] = parsedVal;
            updates[`rooms/${worldKey}`] = parsedVal;

            update(ref(db), updates).then(() => {
                alert("Dünya ayarları başarıyla kaydedildi!");
            }).catch((err) => {
                alert("Hata: " + err.message);
            });
        }

        window.makeWorldPublicDirect = function(worldKey, worldData) {
            const payload = (typeof worldData === 'object' && worldData !== null) ? worldData : { active: true, name: worldKey, updated: Date.now() };
            
            const updates = {};
            updates[`rooms/${worldKey}`] = payload;
            updates[`publicRooms/${worldKey}`] = payload;

            update(ref(db), updates).then(() => {
                alert(`"${worldKey}" ID'li dünya herkese açık hale getirildi!`);
                loadAdminPublicRooms();
            }).catch((err) => {
                alert("Hata: " + err.message);
            });
        }

        window.makeAllWorldsPublic = async function() {
            if (!confirm("Sistemdeki tüm dünyalar herkese açık hale getirilsin mi?")) return;

            const updates = {};
            const userRef = ref(db, 'users');
            const snapshot = await get(userRef);

            if (!snapshot.exists()) {
                alert("Kullanıcı bulunamadı.");
                return;
            }

            let count = 0;
            snapshot.forEach((userSnap) => {
                const userData = userSnap.val() || {};
                for (let key in userData) {
                    if (key === 'profile') continue;
                    let worldData = userData[key];
                    let payload = (typeof worldData === 'object' && worldData !== null) ? worldData : { active: true, name: key, updated: Date.now() };
                    
                    updates[`rooms/${key}`] = payload;
                    updates[`publicRooms/${key}`] = payload;
                    count++;
                }
            });

            update(ref(db), updates).then(() => {
                alert(`Başarılı! Toplam ${count} dünya herkese açıldı!`);
                loadAdminPublicRooms();
            });
        }

        window.makeWorldPrivate = function(worldKey) {
            const updates = {};
            updates[`rooms/${worldKey}`] = null;
            updates[`publicRooms/${worldKey}`] = null;

            update(ref(db), updates).then(() => {
                alert("Dünya özel konuma getirildi!");
                loadAdminPublicRooms();
            });
        }

        window.deleteGlobalRoom = function(roomId) {
            if (confirm(`Bu odayı (${roomId}) tamamen silmek istiyor musun?`)) {
                const updates = {};
                updates[`rooms/${roomId}`] = null;
                updates[`publicRooms/${roomId}`] = null;

                update(ref(db), updates).then(() => {
                    alert("Oda silindi!");
                    loadAdminPublicRooms();
                });
            }
        }

        window.deleteUserWorld = function(uid, worldKey) {
            if (confirm(`Bu dünyayı (${worldKey}) silmek istediğine emin misin?`)) {
                const updates = {};
                updates[`users/${uid}/${worldKey}`] = null;
                updates[`rooms/${worldKey}`] = null;
                updates[`publicRooms/${worldKey}`] = null;

                update(ref(db), updates).then(() => {
                    alert("Dünya silindi!");
                    toggleUserWorlds(uid);
                    loadAdminPublicRooms();
                });
            }
        }

        window.sendResetEmail = function(email) {
            if (!email || email.includes("Bulunamadı")) {
                alert("Bu kullanıcının e-posta adresi kayıtlı değil.");
                return;
            }
            sendPasswordResetEmail(auth, email).then(() => {
                alert(`${email} adresine şifre sıfırlama talimatı gönderildi!`);
            });
        }

        window.deleteUser = function(uid) {
            if (confirm("Bu kullanıcıyı tamamen silmek istiyor musun?")) {
                remove(ref(db, 'users/' + uid)).then(() => {
                    alert("Kullanıcı silindi!");
                    loadAdminData();
                });
            }
        }
    </script>
</body>
</html>
