<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>BlokDiyar - Kategori Düzenli Admin Paneli</title>
    <style>
        body { background: #121212; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        .section { background: #1e1e1e; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        button { background: #ff4444; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-right: 4px; margin-top: 5px; }
        button.green { background: #4CAF50; }
        button.blue { background: #2196F3; }
        button.orange { background: #ff9800; }
        button.purple { background: #9c27b0; }
        ul { list-style: none; padding: 0; }
        li { background: #2a2a2a; margin: 8px 0; padding: 12px; border-radius: 6px; }
        .user-row { display: flex; justify-content: space-between; align-items: center; }
        #auth-status { font-size: 16px; margin-bottom: 15px; font-weight: bold; color: #ffa500; }
        .user-worlds-box { background: #181818; padding: 12px; margin-top: 10px; border-radius: 5px; border-left: 4px solid #4CAF50; display: none; }
        .category-box { background: #222; padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #444; }
        .world-card { background: #1a1a1a; padding: 10px; margin-top: 8px; border-radius: 4px; border-left: 3px solid #2196F3; }
        textarea { background: #333; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 4px; width: 100%; height: 55px; margin-bottom: 5px; font-family: monospace; resize: vertical; }
    </style>
</head>
<body>

    <h1>🛡️ BlokDiyar Kategori ve Oda Yönetim Paneli</h1>
    <div id="auth-status">Giriş kontrol ediliyor...</div>

    <div id="admin-content" style="display:none;">
        
        <!-- HIZLI ODA YÖNETİMİ -->
        <div class="section" style="border: 2px solid #4CAF50; text-align: center;">
            <h2>🚀 Hızlı Oda Yönetimi</h2>
            <button class="green" style="padding: 10px 16px; font-size: 15px;" onclick="window.makeAllWorldsPublic()">🌟 TÜM DÜNYALARI TEK TUŞLA HERKESE AÇ</button>
        </div>

        <!-- AKTİF HERkESE AÇIK KANALLAR -->
        <div class="section">
            <h2>🌟 Aktif Herkese Açık Kanallar (Rooms & PublicRooms)</h2>
            <ul id="admin-public-rooms"></ul>
        </div>

        <!-- KULLANICILAR VE KATEGORİK DÜNYALARI -->
        <div class="section">
            <h2>👥 Kullanıcılar ve Kategorik Verileri</h2>
            <ul id="user-list"></ul>
        </div>
    </div>

    <!-- Firebase SDK'ları -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBqq-KjCuhwsXLLWbfICps4YFzotAOTv8",
            authDomain: "ticarium-c352c.firebaseapp.com",
            databaseURL: "https://ticarium-c352c-default-rtdb.firebaseio.com",
            projectId: "ticarium-c352c",
            storageBucket: "ticarium-c352c.firebasestorage.app",
            messagingSenderId: "527594429663",
            appId: "1:527594429663:web:dd1ffb82249264bebbdd6a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const ADMIN_EMAIL = "mecaga5354@blokdiyar.app"; 

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('auth-status').innerText = `Hoş geldin Admin: ${user.email}`;
                document.getElementById('auth-status').style.color = '#4CAF50';
                document.getElementById('admin-content').style.display = 'block';
                loadAdminData();
            } else {
                const currentEmail = user ? user.email : "Giriş yapılmamış";
                document.getElementById('auth-status').innerText = `Yetkisiz erişim! (${currentEmail}) Lütfen mecaga5354 hesabıyla giriş yap.`;
                document.getElementById('auth-status').style.color = '#ff4444';
            }
        });

        function loadAdminData() {
            loadAdminPublicRooms();

            const userRef = ref(db, 'users');
            get(userRef).then((snapshot) => {
                const userListUl = document.getElementById('user-list');
                userListUl.innerHTML = '';
                if (!snapshot.exists()) {
                    userListUl.innerHTML = '<li>Kayıtlı kullanıcı bulunamadı.</li>';
                    return;
                }
                snapshot.forEach((childSnapshot) => {
                    const uid = childSnapshot.key;
                    const userData = childSnapshot.val() || {};
                    const profile = userData.profile || {};
                    const userEmail = profile.email || "E-posta bulunamadı";
                    
                    let li = document.createElement('li');
                    li.innerHTML = `
                        <div class="user-row">
                            <span><b>Kullanıcı:</b> ${profile.username || profile.name || 'İsimsiz'} <br><small style="color:#aaa;">E-posta: ${userEmail}</small><br><small style="color:#888;">UID: ${uid}</small></span>
                            <div>
                                <button class="purple" onclick="window.sendResetEmail('${userEmail}')">Şifre Sıfırla</button>
                                <button class="blue" onclick="window.toggleUserCategories('${uid}')">Kategorileri & Dünyaları Gör</button>
                                <button onclick="window.deleteUser('${uid}')">Hesabı Sil</button>
                            </div>
                        </div>
                        <div id="user-cats-${uid}" class="user-worlds-box">
                            <p>Kategoriler yükleniyor...</p>
                        </div>
                    `;
                    userListUl.appendChild(li);
                });
            });
        }

        // Aktif herkese açık odaları listele
        window.loadAdminPublicRooms = function() {
            const publicRef = ref(db, 'rooms');
            get(publicRef).then((snapshot) => {
                const container = document.getElementById('admin-public-rooms');
                container.innerHTML = '';
                if (!snapshot.exists()) {
                    container.innerHTML = '<li>Aktif herkese açık oda bulunmuyor.</li>';
                    return;
                }
                snapshot.forEach((childSnapshot) => {
                    const roomId = childSnapshot.key;
                    let li = document.createElement('li');
                    li.innerHTML = `
                        <span><b>Oda ID:</b> <span style="color:#4CAF50;">${roomId}</span></span>
                        <div>
                            <button class="orange" onclick="window.makeWorldPrivate('${roomId}')">Özel Yap (Kapat)</button>
                            <button onclick="window.deleteGlobalRoom('${roomId}')">Tamamen Sil</button>
                        </div>
                    `;
                    container.appendChild(li);
                });
            });
        }

        // Kullanıcıya basınca verilerini kategori kategori (Dünyalar, Odalar, Profil vb.) sırayla listeleyen fonksiyon
        window.toggleUserCategories = function(uid) {
            const box = document.getElementById(`user-cats-${uid}`);
            if (box.style.display === 'block') {
                box.style.display = 'none';
                return;
            }
            box.style.display = 'block';

            const userRef = ref(db, `users/${uid}`);
            get(userRef).then((snapshot) => {
                if (!snapshot.exists()) {
                    box.innerHTML = '<p>Bu kullanıcıya ait veri yok.</p>';
                    return;
                }
                const data = snapshot.val();
                let html = '<h4>📁 Kullanıcı Kategorileri ve İçerikleri:</h4>';
                
                let hasCategory = false;
                for (let catKey in data) {
                    hasCategory = true;
                    let catData = data[catKey];
                    let catJson = JSON.stringify(catData, null, 2);

                    html += `
                        <div class="category-box">
                            <b style="color:#ff9800; font-size:15px;">📂 Kategori / Anahtar: [ ${catKey} ]</b><br><br>
                    `;

                    // Eğer bu kategori içinde alt dünyalar/odalar varsa onları da sırayla gösterelim
                    if (typeof catData === 'object' && catData !== null) {
                        for (let subKey in catData) {
                            let subVal = catData[subKey];
                            let subValStr = (typeof subVal === 'object') ? JSON.stringify(subVal) : subVal;

                            html += `
                                <div class="world-card">
                                    <span style="color:#2196F3; font-weight:bold;">Oda / Alt ID: ${subKey}</span><br>
                                    <label style="font-size:12px; color:#aaa;">Oda Ayarları / Özellikleri:</label>
                                    <textarea id="input-${uid}-${catKey}-${subKey}">${subValStr}</textarea>
                                    <button class="green" onclick="window.saveSubSettings('${uid}', '${catKey}', '${subKey}')">Kaydet</button>
                                    <button class="blue" onclick="window.makeWorldPublicDirect('${subKey}', ${JSON.stringify(subVal).replace(/'/g, "&#39;")})">Herkese Aç</button>
                                    <button class="orange" onclick="window.makeWorldPrivate('${subKey}')">Özel Yap</button>
                                    <button onclick="window.deleteSubWorld('${uid}', '${catKey}', '${subKey}')">Sil</button>
                                </div>
                            `;
                        }
                    } else {
                        // Düz metin veya tekil veriyse
                        html += `
                            <label style="font-size:12px; color:#aaa;">Değer:</label>
                            <textarea id="input-${uid}-${catKey}">${catData}</textarea>
                            <button class="green" onclick="window.saveCatSettings('${uid}', '${catKey}')">Kategoriyi Kaydet</button>
                        `;
                    }

                    html += `</div>`;
                }

                if (!hasCategory) {
                    html += '<p style="color:#aaa;">Bu kullanıcının hiç verisi bulunmuyor.</p>';
                }

                box.innerHTML = html;
            });
        }

        // Alt dünya ayarlarını kaydetme
        window.saveSubSettings = function(uid, catKey, subKey) {
            const valStr = document.getElementById(`input-${uid}-${catKey}-${subKey}`).value;
            let parsedVal;
            try {
                parsedVal = JSON.parse(valStr);
            } catch (e) {
                parsedVal = valStr;
            }

            const updates = {};
            updates[`users/${uid}/${catKey}/${subKey}`] = parsedVal;

            update(ref(db), updates).then(() => {
                alert("Oda / Dünya ayarları başarıyla kaydedildi!");
            }).catch((err) => {
                alert("Hata: " + err.message);
            });
        }

        // Tek bir odayı KESİN OLARAK hem rooms hem publicRooms altına yazarak herkese açma
        window.makeWorldPublicDirect = function(worldKey, worldData) {
            const payload = (typeof worldData === 'object' && worldData !== null) ? worldData : { active: true, name: worldKey, updated: Date.now() };
            
            const updates = {};
            updates[`rooms/${worldKey}`] = payload;
            updates[`publicRooms/${worldKey}`] = payload;

            update(ref(db), updates).then(() => {
                alert(`"${worldKey}" ID'li oda hem rooms hem publicRooms altına yazılarak herkese açıldı! Oyun artık görebilir.`);
                loadAdminPublicRooms();
            }).catch((err) => {
                alert("Hata: " + err.message);
            });
        }

        // Tek tuşla tüm dünyaları herkese aç
        window.makeAllWorldsPublic = async function() {
            if (!confirm("Sistemdeki tüm dünyalar hem rooms hem publicRooms altına yazılarak herkese açılsın mi?")) return;

            const updates = {};
            const userRef = ref(db, 'users');
            const snapshot = await get(userRef);

            if (!snapshot.exists()) {
                alert("Kullanıcı bulunamadı.");
                return;
            }

            let count = 0;
            snapshot.forEach((userSnap) => {
                const userData = userSnap.val() || {};
                for (let catKey in userData) {
                    let catData = userData[catKey];
                    if (typeof catData === 'object' && catData !== null) {
                        for (let subKey in catData) {
                            let subVal = catData[subKey];
                            let payload = (typeof subVal === 'object' && subVal !== null) ? subVal : { active: true, name: subKey, updated: Date.now() };
                            
                            updates[`rooms/${subKey}`] = payload;
                            updates[`publicRooms/${subKey}`] = payload;
                            count++;
                        }
                    }
                }
            });

            update(ref(db), updates).then(() => {
                alert(`Başarılı! Toplam ${count} dünya herkese açıldı ve oyun listesine eklendi!`);
                loadAdminPublicRooms();
            });
        }

        window.makeWorldPrivate = function(worldKey) {
            const updates = {};
            updates[`rooms/${worldKey}`] = null;
            updates[`publicRooms/${worldKey}`] = null;

            update(ref(db), updates).then(() => {
                alert("Oda özel konuma getirildi ve oyun listesinden kaldırıldı!");
                loadAdminPublicRooms();
            });
        }

        window.deleteGlobalRoom = function(roomId) {
            if (confirm(`Bu odayı (${roomId}) tamamen silmek istiyor musun?`)) {
                const updates = {};
                updates[`rooms/${roomId}`] = null;
                updates[`publicRooms/${roomId}`] = null;

                update(ref(db), updates).then(() => {
                    alert("Oda tamamen silindi!");
                    loadAdminPublicRooms();
                });
            }
        }

        window.deleteSubWorld = function(uid, catKey, subKey) {
            if (confirm(`Bu dünyayı (${subKey}) silmek istediğine emin misin?`)) {
                const updates = {};
                updates[`users/${uid}/${catKey}/${subKey}`] = null;
                updates[`rooms/${subKey}`] = null;
                updates[`publicRooms/${subKey}`] = null;

                update(ref(db), updates).then(() => {
                    alert("Dünya silindi!");
                    toggleUserCategories(uid);
                    loadAdminPublicRooms();
                });
            }
        }

        window.sendResetEmail = function(email) {
            if (!email || email.includes("Bulunamadı")) {
                alert("Bu kullanıcının geçerli bir e-posta adresi kayıtlı değil.");
                return;
            }
            sendPasswordResetEmail(auth, email).then(() => {
                alert(`${email} adresine şifre sıfırlama talimatı gönderildi!`);
            });
        }

        window.deleteUser = function(uid) {
            if (confirm("Bu kullanıcıyı tamamen silmek istiyor musun?")) {
                remove(ref(db, 'users/' + uid)).then(() => {
                    alert("Kullanıcı silindi!");
                    loadAdminData();
                });
            }
        }
    </script>
</body>
</html>
