<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dosya kontrolü</title>
<style>
body{font-family:system-ui,sans-serif;background:#1d2330;color:#fff;padding:16px}
.ok{color:#6f6}.bad{color:#f77;font-weight:700}
div{padding:3px 0;font-size:15px}
</style>
</head>
<body>
<h3>Ticarium dosya kontrolü</h3>
<div id="out">Kontrol ediliyor...</div>
<script>
// dosya: yeni sürümde mutlaka geçen yazı
var files = {
  'css/style.css': '', 'js/main.js': 'gameClock', 'js/world.js': 'spawnPos', 'js/textures.js': 'water',
  'js/player.js': 'inWater', 'js/input.js': '', 'js/economy.js': '', 'js/ui.js': '', 'js/bag.js': '',
  'js/items.js': '', 'js/health.js': 'starve', 'js/hunger.js': 'tickHunger', 'js/mobs.js': 'spawnAnimals',
  'js/sky.js': 'gameClock', 'js/save.js': '', 'js/gravity.js': 'WATER', 'js/menu.js': '', 'js/rooms.js': 'checkOwned',
  'js/online.js': 'findPlayer', 'js/firebase.js': '', 'js/state.js': '', 'js/sound.js': 'splash',
  'js/avatars.js': 'animateAvatar', 'js/progress.js': 'food', 'js/panels.js': 'showFood', 'js/death.js': 'spawnPos',
  'js/actions.js': 'findMob', 'js/session.js': 'clearChat', 'js/chat.js': 'toggleChat'
};
var names = Object.keys(files), out = document.getElementById('out');
var html = '', bad = 0, done = 0;
names.forEach(function (f) {
  fetch(f + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
    if (!r.ok) { bad++; html += '<div class="bad">❌ EKSİK: ' + f + '</div>'; return; }
    return r.text().then(function (t) {
      var key = files[f];
      if (key && t.indexOf(key) < 0) { bad++; html += '<div class="bad">⚠️ ESKİ SÜRÜM: ' + f + '</div>'; }
      else html += '<div class="ok">✅ ' + f + '</div>';
    });
  }).catch(function () {
    bad++; html += '<div class="bad">❌ EKSİK: ' + f + '</div>';
  }).then(function () {
    done++;
    if (done === names.length) {
      out.innerHTML = (bad ? '<div class="bad">' + bad + ' sorunlu dosya:</div>' : '<div class="ok">Hepsi güncel ✅</div>') + html;
    }
  });
});
</script>
</body>
</html>
