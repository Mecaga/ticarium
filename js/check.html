<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dosya kontrolü</title>
<style>
body{font-family:system-ui,sans-serif;background:#1d2330;color:#fff;padding:16px}
.ok{color:#6f6}.bad{color:#f77;font-weight:700}.old{color:#fc6;font-weight:700}
div{padding:3px 0;font-size:15px}
</style>
</head>
<body>
<h3>Ticarium dosya kontrolü</h3>
<div id="out">Kontrol ediliyor...</div>
<script>
var files = {
  'index.html': 'sWorlds', 'css/style.css': '#chatBox',
  'js/main.js': 'updateWater', 'js/world.js': 'export const wh', 'js/textures.js': 'wbucket',
  'js/player.js': 'inWater', 'js/input.js': 'export function initInput', 'js/economy.js': 'export function startPriceTicker',
  'js/ui.js': 'MARKET_ON', 'js/bag.js': 'export function toggleBag', 'js/items.js': 'export function dropItems',
  'js/health.js': 'starve', 'js/hunger.js': 'export function tickHunger', 'js/mobs.js': 'surfaceY',
  'js/sky.js': 'export function gameClock', 'js/save.js': 'saveHooks', 'js/gravity.js': 'WATER',
  'js/menu.js': 'async function diag', 'js/menu-lists.js': 'KINDS', 'js/menu-worlds.js': 'export function makeWorlds',
  'js/rooms.js': "type === 'world'", 'js/online.js': 'sendPaint', 'js/firebase.js': 'serverTimestamp',
  'js/state.js': 'export const G', 'js/sound.js': 'splash', 'js/avatars.js': 'export function animateAvatar',
  'js/progress.js': 'recordPaint', 'js/panels.js': 'setChatVisible', 'js/death.js': 'spawnPos',
  'js/actions.js': 'useCanvas', 'js/session.js': 'setSimulate', 'js/chat.js': 'export function initChat',
  'js/cloud.js': 'export async function createWorld', 'js/water.js': 'export function updateWater',
  'js/paints.js': 'export function setPaint', 'js/draw.js': 'export function openDraw'
};
var names = Object.keys(files), out = document.getElementById('out');
var rows = [], bad = 0, old = 0, done = 0;
names.forEach(function (f, i) {
  fetch(f + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
    if (!r.ok) { bad++; rows[i] = '<div class="bad">❌ EKSİK: ' + f + '</div>'; return; }
    return r.text().then(function (t) {
      if (t.indexOf(files[f]) < 0) { old++; rows[i] = '<div class="old">⚠️ ESKİ/BOŞ/YARIM: ' + f + ' (' + t.length + ' karakter)</div>'; }
      else rows[i] = '<div class="ok">✅ ' + f + '</div>';
    });
  }).catch(function () {
    bad++; rows[i] = '<div class="bad">❌ EKSİK: ' + f + '</div>';
  }).then(function () {
    done++;
    if (done === names.length) {
      var head = (bad || old) ? '<div class="bad">' + bad + ' eksik, ' + old + ' sorunlu. Kırmızı ve sarıları güncelle:</div>'
        : '<div class="ok">Hepsi güncel ✅ Oyun yine hata veriyorsa tarayıcı önbelleğidir.</div>';
      out.innerHTML = head + rows.join('');
    }
  });
});
</script>
</body>
</html>
