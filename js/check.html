<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dosya kontrolü</title>
<style>
body{font-family:system-ui,sans-serif;background:#1d2330;color:#fff;padding:16px}
.ok{color:#6f6}.bad{color:#f77;font-weight:700}.old{color:#fc6;font-weight:700}
div{padding:3px 0;font-size:15px}
</style>
</head>
<body>
<h3>BlokDiyar dosya kontrolü</h3>
<div id="out">Kontrol ediliyor...</div>
<script>
var files = {
  'index.html': 'sAuth', 'css/style.css': '#chatBox', 'js/main.js': 'chunksReady',
  'js/core/state.js': 'export const G', 'js/core/save.js': 'saveHooks', 'js/core/firebase.js': 'serverTimestamp',
  'js/core/sound.js': 'splash', 'js/core/auth.js': 'export async function doRegister',
  'js/world/world.js': 'export function chunksReady', 'js/world/textures.js': 'export function iconURL',
  'js/world/fluids.js': 'holeDist', 'js/world/gravity.js': 'WATER', 'js/world/sky.js': 'FOG_NEAR', 'js/world/paints.js': 'isLoaded',
  'js/entities/player.js': 'isLoaded', 'js/entities/mobs.js': 'lavaT', 'js/entities/avatars.js': 'export function animateAvatar',
  'js/entities/items.js': 'spriteGeometry', 'js/entities/health.js': 'god', 'js/entities/hunger.js': 'export function tickHunger',
  'js/entities/vitals.js': 'export function tickVitals',
  'js/net/cloud.js': 'userName', 'js/net/rooms.js': 'core/auth.js', 'js/net/online.js': 'core/auth.js',
  'js/ui/menu.js': 'doRegister', 'js/ui/menu-lists.js': 'worldRooms', 'js/ui/menu-worlds.js': 'playWorld',
  'js/ui/dialog.js': 'export function askDialog', 'js/ui/panels.js': 'setChatVisible', 'js/ui/chat.js': 'runCommand',
  'js/ui/bag.js': 'bagTabs', 'js/ui/draw.js': 'export function openDraw', 'js/ui/ui.js': 'iconHTML', 'js/ui/input.js': 'breakDown',
  'js/game/actions.js': 'decayLeaves', 'js/game/mining.js': 'makeCrack', 'js/game/session.js': 'requestLeave',
  'js/game/progress.js': 'layout', 'js/game/death.js': 'drown', 'js/game/creative.js': 'export function setCreative',
  'js/game/commands.js': 'addItem', 'js/game/economy.js': 'layout', 'js/game/inventory.js': 'export function syncLayout'
};
var names = Object.keys(files), out = document.getElementById('out');
var rows = [], bad = 0, old = 0, done = 0;
names.forEach(function (f, i) {
  fetch(f + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
    if (!r.ok) { bad++; rows[i] = '<div class="bad">❌ EKSİK: ' + f + '</div>'; return; }
    return r.text().then(function (t) {
      if (t.indexOf(files[f]) < 0) { old++; rows[i] = '<div class="old">⚠️ ESKİ/BOŞ/YARIM: ' + f + ' (' + t.length + ' karakter)</div>'; }
      else rows[i] = '<div class="ok">✅ ' + f + '</div>';
    });
  }).catch(function () {
    bad++; rows[i] = '<div class="bad">❌ EKSİK: ' + f + '</div>';
  }).then(function () {
    done++;
    if (done === names.length) {
      var head = (bad || old) ? '<div class="bad">' + bad + ' eksik, ' + old + ' sorunlu. Kırmızı ve sarıları güncelle:</div>'
        : '<div class="ok">Hepsi güncel ✅ Oyun yine hata veriyorsa tarayıcı önbelleğidir.</div>';
      out.innerHTML = head + rows.join('');
    }
  });
});
</script>
</body>
</html>
