<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BlokDiyar</title>
<link rel="stylesheet" href="css/style.css?v=34">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="flash"></div>
<div id="coord"></div>
<div id="roomInfo"></div>
<div id="coins">🪙 50</div>
<div id="cross"></div>
<div id="msg"></div>
<div id="hearts"></div>
<div id="hotbar"></div>
<div id="look"></div>
<div id="joy"></div>
<div id="joyBase"><div id="joyKnob"></div></div>
<div class="btn" id="bJump">Zıpla</div>
<div class="btn" id="bBreak">Kır</div>
<div class="btn" id="bPlace">Koy</div>
<div class="btn" id="bAttack">⚔️</div>
<div class="btn" id="bMarket">🏪 Pazar</div>
<div class="btn" id="bPlayers">👥</div>
<div class="btn" id="bSettings">⚙️ Ayarlar</div>
<div class="btn" id="bLeave">💾 Kaydet ve Çık</div>
<div id="market"><div id="panel"></div></div>
<div id="settings"><div id="setBox"></div></div>
<div id="players"><div id="plBox"></div></div>

<div id="menu">
  <div class="mbox">
    <h1>BlokDiyar</h1>
    <div id="sAuth" style="display:none">
      <p id="auHint"></p>
      <input id="auUser" maxlength="16" placeholder="Kullanıcı adı (a-z, 0-9, _)" autocapitalize="off" autocomplete="username" spellcheck="false">
      <input id="auPass" type="password" maxlength="40" placeholder="Şifre (en az 6 karakter)" autocomplete="current-password">
      <button id="auLogin">Giriş Yap</button>
      <button id="auReg" class="alt">Kayıt Ol</button>
    </div>
    <div id="sMain" style="display:none">
      <div id="mUser"></div>
      <input id="nameIn" maxlength="14" placeholder="Oyuncu adın" style="display:none">
      <button id="mWorlds">🌍 Dünyalarım</button>
      <button id="mCreate">🏠 Oda Kur</button>
      <button id="mList">🌐 Açık Odalar</button>
      <button id="mJoin">🔑 Kodla Katıl</button>
      <button id="mMine">⭐ Odalarım (Herkese Açık)</button>
      <button id="mLogout" class="alt">🚪 Hesaptan çık</button>
    </div>
    <div id="sWorlds" style="display:none">
      <div id="wInfo"></div>
      <div id="worldList"></div>
      <button id="wNew">➕ Yeni Dünya</button>
      <button class="back alt">Geri</button>
    </div>
    <div id="sNew" style="display:none">
      <input id="nwName" maxlength="24" placeholder="Dünya adı">
      <select id="nwKind"></select>
      <button id="nwDo">Dünyayı Kur</button>
      <button id="nwBack" class="alt">Geri</button>
    </div>
    <div id="sCreate">
      <label class="chk">Dünya
        <select id="cWorld" style="flex:1;min-width:0"></select>
      </label>
      <input id="cName" maxlength="24" placeholder="Oda adı (dünya adı otomatik gelir)">
      <label class="chk"><input type="checkbox" id="cPublic" checked> Herkese açık (Açık Odalar'da görünsün)</label>
      <label class="chk"><input type="checkbox" id="cPvp"> PVP açık (oyuncular birbirine vurabilir)</label>
      <label class="chk"><input type="checkbox" id="cKeep"> Envanteri koru (ölünce eşyalar düşmez)</label>
      <label class="chk">Oyuncu limiti
        <select id="cMax">
          <option value="2">2</option>
          <option value="4">4</option>
          <option value="6">6</option>
          <option value="8" selected>8</option>
          <option value="10">10</option>
        </select>
      </label>
      <button id="cDo">Odayı Kur</button>
      <button class="back alt">Geri</button>
    </div>
    <div id="sList">
      <div id="roomList"></div>
      <button class="back alt">Geri</button>
    </div>
    <div id="sJoin">
      <input id="jCode" maxlength="6" placeholder="6 haneli kod" style="text-transform:uppercase">
      <button id="jDo">Katıl</button>
      <button class="back alt">Geri</button>
    </div>
    <div id="sMine">
      <div id="mineList"></div>
      <button class="back alt">Geri</button>
    </div>
    <div id="mErr"></div>
    <div id="mAuth"></div>
    <div id="mVer" style="font-size:11px;opacity:.55;text-align:center;margin-top:4px"></div>
  </div>
</div>

<script>
function showErr(t) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#b3261e;color:#fff;padding:10px;font-size:12px;z-index:99;word-break:break-all';
  d.textContent = '❌ ' + t + ' (kapatmak için dokun)';
  d.onclick = function () { d.remove(); };
  document.body.appendChild(d);
}
window.addEventListener('error', function (e) {
  showErr((e.message || 'Hata') + ' ' + (e.filename || '') + ':' + (e.lineno || ''));
});
window.addEventListener('unhandledrejection', function (e) {
  showErr(String(e.reason && (e.reason.message || e.reason)));
});

var ids = ['flash','coord','coins','roomInfo','msg','hearts','hotbar','look','joy','joyBase','joyKnob','bJump','bBreak','bPlace',
  'bAttack','bMarket','bPlayers','bLeave','bSettings','market','panel','settings','setBox','players','plBox','menu','nameIn',
  'sAuth','auHint','auUser','auPass','auLogin','auReg','mUser','mLogout',
  'mWorlds','mCreate','mList','mJoin','mMine','sWorlds','sNew','wInfo','worldList','wNew','nwName','nwKind','nwDo','nwBack',
  'cName','cWorld','cPublic','cPvp','cKeep','cMax','cDo','sMain','sCreate','sList','sJoin','sMine','roomList','mineList',
  'jCode','jDo','mErr','mAuth'];
var missing = ids.filter(function (i) { return !document.getElementById(i); });

var FILES = [
  'js/core/state.js', 'js/core/save.js', 'js/core/firebase.js', 'js/core/sound.js', 'js/core/auth.js',
  'js/world/world.js', 'js/world/textures.js', 'js/world/texturepack.js', 'js/world/fluids.js', 'js/world/gravity.js', 'js/world/sky.js', 'js/world/paints.js',
  'js/entities/player.js', 'js/entities/mobs.js', 'js/entities/avatars.js', 'js/entities/items.js', 'js/entities/health.js',
  'js/entities/hunger.js', 'js/entities/vitals.js',
  'js/net/cloud.js', 'js/net/rooms.js', 'js/net/online.js',
  'js/ui/menu.js', 'js/ui/menu-lists.js', 'js/ui/menu-worlds.js', 'js/ui/dialog.js', 'js/ui/panels.js', 'js/ui/chat.js',
  'js/ui/bag.js', 'js/ui/draw.js', 'js/ui/ui.js', 'js/ui/input.js', 'js/ui/craft.js', 'js/ui/furnace.js',
  'js/game/actions.js', 'js/game/mining.js', 'js/game/session.js', 'js/game/progress.js', 'js/game/death.js',
  'js/game/creative.js', 'js/game/commands.js', 'js/game/economy.js', 'js/game/inventory.js', 'js/game/gear.js',
  'js/game/recipes.js', 'js/game/armor.js', 'js/game/doors.js', 'js/game/looks.js', 'js/game/chests.js',
  'js/game/store.js', 'js/game/book.js', 'js/game/modes.js', 'js/game/books2.js', 'js/entities/armorvis.js',
  'js/main.js?v=34'
];
function refresh() {
  var jobs = FILES.map(function (f) { return fetch(f, { cache: 'no-cache' }).catch(function () {}); });
  return Promise.race([Promise.all(jobs), new Promise(function (r) { setTimeout(r, 6000); })]);
}

if (missing.length) {
  showErr('index.html eski, eksik elemanlar: ' + missing.join(', '));
} else {
  refresh().then(function () { return import('./js/main.js?v=34'); }).then(function () {
    return import('./js/world/world.js');
  }).then(function (m) {
    var v = document.getElementById('mVer');
    if (v) v.textContent = 'Sürüm 34 · kod ' + (m.BUILD || 'ESKİ: site verisini temizle');
  }).catch(function (e) {
    showErr('Yükleme hatası (bir js dosyası eski ya da eksik olabilir): ' + (e.message || e));
  });
}
</script>
</body>
</html>
