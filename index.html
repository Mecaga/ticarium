<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ticarium 3D</title>
<link rel="stylesheet" href="css/style.css?v=9">
<script type="importmap">
{
  "imports": {
    "./js/main.js": "./js/main.js?v=9",
    "./js/world.js": "./js/world.js?v=9",
    "./js/player.js": "./js/player.js?v=9",
    "./js/input.js": "./js/input.js?v=9",
    "./js/economy.js": "./js/economy.js?v=9",
    "./js/ui.js": "./js/ui.js?v=9",
    "./js/bag.js": "./js/bag.js?v=9",
    "./js/menu.js": "./js/menu.js?v=9",
    "./js/rooms.js": "./js/rooms.js?v=9",
    "./js/online.js": "./js/online.js?v=9",
    "./js/firebase.js": "./js/firebase.js?v=9"
  }
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="coins">🪙 50</div>
<div id="roomInfo"></div>
<div id="cross"></div>
<div id="msg"></div>
<div id="hotbar"></div>
<div id="look"></div>
<div id="joy"></div>
<div id="joyBase"><div id="joyKnob"></div></div>
<div class="btn" id="bJump">Zıpla</div>
<div class="btn" id="bBreak">Kır</div>
<div class="btn" id="bPlace">Koy</div>
<div class="btn" id="bMarket">🏪 Pazar</div>
<div class="btn" id="bLeave">🚪 Çık</div>
<div id="market"><div id="panel"></div></div>

<div id="menu">
  <div class="mbox">
    <h1>Ticarium</h1>
    <div id="sMain">
      <input id="nameIn" maxlength="14" placeholder="Oyuncu adın">
      <button id="mCreate">Oda Kur</button>
      <button id="mList">Açık Odalar</button>
      <button id="mJoin">Kodla Katıl</button>
      <button id="mSolo" class="alt">Tek Oyunculu</button>
    </div>
    <div id="sCreate">
      <input id="cName" maxlength="24" placeholder="Oda adı">
      <label class="chk"><input type="checkbox" id="cPublic" checked> Herkese açık (listede görünsün)</label>
      <button id="cDo">Odayı Kur</button>
      <button class="back alt">Geri</button>
    </div>
    <div id="sList">
      <div id="roomList"></div>
      <button class="back alt">Geri</button>
    </div>
    <div id="sJoin">
      <input id="jCode" maxlength="6" placeholder="6 haneli kod" style="text-transform:uppercase">
      <button id="jDo">Katıl</button>
      <button class="back alt">Geri</button>
    </div>
    <div id="mErr"></div>
  </div>
</div>

<script type="module">
const V = 9;
function showErr(t) {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#b3261e;color:#fff;padding:10px;font-size:12px;z-index:99;word-break:break-all';
  d.textContent = '❌ ' + t + ' (kapatmak için dokun)';
  d.onclick = () => d.remove();
  document.body.appendChild(d);
}
addEventListener('error', e => showErr((e.message || 'Hata') + ' ' + (e.filename || '') + ':' + (e.lineno || '')));
addEventListener('unhandledrejection', e => showErr(String(e.reason && (e.reason.message || e.reason))));

// Dosya kontrolü: hangisi eski ya da eksik?
const need = {
  world: ['TYPES', 'generate'],
  economy: ['resetEco', 'net'],
  ui: ['hooks', 'drawHud'],
  bag: ['toggleBag'],
  online: ['startOnline'],
  rooms: ['createRoom'],
  menu: ['initMenu']
};
const bad = [];
for (const k in need) {
  try {
    const m = await import('./js/' + k + '.js');
    const miss = need[k].filter(n => !(n in m));
    if (miss.length) bad.push(k + '.js ESKİ (eksik: ' + miss.join(',') + ')');
    if (k === 'world' && Object.keys(m.TYPES).length !== 10) bad.push('world.js ESKİ (10 blok yok)');
  } catch (e) {
    bad.push(k + '.js yüklenemedi: ' + (e.message || e));
  }
}
if (bad.length) showErr('Güncellenecek dosyalar: ' + bad.join(' | '));
else import('./js/main.js').catch(e => showErr('main.js: ' + (e.message || e)));
</script>
</body>
</html>
